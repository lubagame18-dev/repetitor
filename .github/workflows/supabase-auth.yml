# Включение/выключение входа по коду (анонимных сессий) в Supabase.
# Нужно для кнопки «Войти по коду» в кабинете разработчика (dev.html).
# Запуск: Actions → «Supabase – вход по коду» → Run workflow (режим on/off).
name: Supabase – вход по коду
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "on – включить анонимный вход, off – выключить"
        required: false
        default: "on"
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: affncgnhqfvdbtyujfvz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Текущие флаги входа
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "Нет секрета SUPABASE_ACCESS_TOKEN"; exit 2; fi
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" -o before.json
          jq -r '{external_anonymous_users_enabled, disable_signup, mailer_autoconfirm}' before.json
      - name: Включить/выключить вход по коду
        run: |
          set -euo pipefail
          if [ "${MODE:-on}" = "off" ]; then VAL=false; else VAL=true; fi
          echo "external_anonymous_users_enabled = $VAL"
          code=$(curl -sS -o after.json -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"external_anonymous_users_enabled\": $VAL}")
          echo "PATCH HTTP $code"
          jq -r '{external_anonymous_users_enabled, disable_signup, mailer_autoconfirm}' after.json 2>/dev/null || head -c 800 after.json || true
          test "$code" -ge 200 -a "$code" -lt 300
      - name: Проверить публичные настройки
        run: |
          set -euo pipefail
          key=$(grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' config.js | head -1)
          curl -sS "https://$PROJECT_REF.supabase.co/auth/v1/settings" -H "apikey: $key" -o pub.json
          echo "anonymous_users=$(jq -r '.external.anonymous_users' pub.json)"
          test "$(jq -r '.external.anonymous_users' pub.json)" = "true"
