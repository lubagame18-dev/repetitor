# Обновление Supabase из репозитория: база (supabase/schema.sql) и серверная функция нейросети (supabase/functions/ai).
# Ключи – только в секретах репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN – личный токен Supabase (Account → Access Tokens)
#   SUPABASE_DB_URL       – строка подключения к базе (Connect → Session pooler, с паролем)
# Итог каждого запуска записывается в .github/supabase-status.md (без ключей).
name: Supabase – база и нейросеть
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml", ".github/supabase-run"]
permissions:
  contents: write
concurrency: supabase
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: affncgnhqfvdbtyujfvz
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: База данных
        continue-on-error: true
        run: |
          if [ -z "$DB_URL" ]; then echo "нет секрета SUPABASE_DB_URL" > db.log; exit 1; fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f supabase/schema.sql > db.log 2>&1 && echo "ok" >> db.log || { echo "ОШИБКА (изменения отменены)" >> db.log; exit 1; }
      - name: Функция нейросети
        continue-on-error: true
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "нет секрета SUPABASE_ACCESS_TOKEN" > fn.log; exit 1; fi
          supabase functions deploy ai --project-ref "$PROJECT_REF" --use-api > fn.log 2>&1 && echo "ok" >> fn.log || { echo "ОШИБКА" >> fn.log; exit 1; }
      - name: Отчёт
        if: always()
        run: |
          clean() { sed -E 's#postgres(ql)?://[^ ]*#postgres://***#g; s#sbp_[A-Za-z0-9]+#sbp_***#g' "$1" 2>/dev/null | tail -c 4000; }
          {
            echo "# Последнее обновление Supabase"
            echo; echo "Время: $(date -u '+%Y-%m-%d %H:%M UTC') · коммит ${GITHUB_SHA::7}"
            echo; echo "## База (schema.sql)"; echo '```'; clean db.log; echo '```'
            echo; echo "## Функция ai"; echo '```'; clean fn.log; echo '```'
          } > .github/supabase-status.md
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add .github/supabase-status.md
          git commit -m "Отчёт об обновлении Supabase [skip ci]" || exit 0
          git pull --rebase -q && git push -q
